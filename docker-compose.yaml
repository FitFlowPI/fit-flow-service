version: '3'
services:
  postgres:
    image: postgres:13
    container_name: npostgres-container
    environment:
      POSTGRES_USER: fitflow
      POSTGRES_PASSWORD: fitflow
      POSTGRES_DB: fitflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - spring-network

  spring-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: spring-app-container
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fitflow_db
      SPRING_DATASOURCE_USERNAME: fitflow
      SPRING_DATASOURCE_PASSWORD: fitflow
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - spring-network

volumes:
  postgres_data:

networks:
  spring-network:
